# The touchpads of this machine, for the X server.
#
# Written by likeos-input-devices, which init keeps running: it
# rewrites this file whenever a touchpad appears or goes away and
# removes it when there is none.  The X server reads it when it
# starts.  Do not edit it -- put settings in /etc/likeos/touchpad.conf
# and run likeos-input-devices as root instead.
#
# "AutoServerLayout" adds each touchpad to whichever configuration
# the server runs with, beside its keyboard and mouse.  The touchpad
# itself is handled by libinput: tapping, scrolling, clickpad
# buttons, palm and thumb detection, acceleration and gestures.

# VEN_0488:00 0488:1085 Touchpad: i2c 0488:1085, clickpad
Section "InputDevice"
	Identifier	"VEN_0488:00 0488:1085 Touchpad"
	Driver		"libinput"
	Option		"Device"		"/dev/input/event5"
	Option		"AutoServerLayout"	"on"
	Option		"Tapping"		"on"
	Option		"TappingDrag"		"on"
	Option		"NaturalScrolling"	"off"
	Option		"ScrollMethod"		"twofinger"
	Option		"DisableWhileTyping"	"on"
	Option		"AccelProfile"		"adaptive"
EndSection
