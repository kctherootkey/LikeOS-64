# Meson cross file for the LikeOS X.Org port.
#
# Used by the packages that no longer ship autotools: pixman, libxkbcommon and
# (later) Mesa.  `system = 'likeos'` is what makes meson treat this as a cross
# build, so it never tries to run a target binary to probe something.
#
# The compiler entry is the same wrapper autotools uses, so both build systems
# see one toolchain definition rather than two that can drift apart.

[binaries]
c = 'likeos-cc'
cpp = 'likeos-c++'
ar = 'ar'
strip = 'strip'
pkg-config = 'likeos-pkg-config'
# Mesa's LLVM detection.  A wrapper (toolchain/llvm-config): version and
# component questions are delegated to the native stage-1 llvm-config,
# path and library questions are answered for the sysroot.
llvm-config = 'llvm-config'

# GLib's code generators.  These are BUILD-machine programs -- they read XML and
# emit C, and a cross-built one could not run here -- so they are named bare and
# resolved from PATH, which build.sh puts .hosttools/bin at the front of.  That
# is the port's own native GLib, built from the same tarball as the target one;
# naming them here as well as on PATH means a package that asks meson for them
# by name gets that copy rather than whatever the build host happens to have
# installed, which is a different version.
glib-compile-resources = 'glib-compile-resources'
glib-compile-schemas = 'glib-compile-schemas'
glib-genmarshal = 'glib-genmarshal'
glib-mkenums = 'glib-mkenums'
gdbus-codegen = 'gdbus-codegen'

[host_machine]
system = 'likeos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# Nothing target-side can be executed here, so any test meson would normally
# run has to be answered up front.
needs_exe_wrapper = true
sys_root = '@GLOBAL_SOURCE_ROOT@/build/xorg-sysroot'

[built-in options]
# The wrapper already supplies the include/library paths and the freestanding
# flags; meson must not add a default -O/-g set that contradicts them.
c_args = []
c_link_args = []
default_library = 'shared'
prefix = '/usr'
