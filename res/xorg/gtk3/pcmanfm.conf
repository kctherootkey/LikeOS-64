# PCManFM's system-wide defaults, installed as
# /etc/xdg/pcmanfm/default/pcmanfm.conf.
#
# Copied to ~/.config/pcmanfm/default/pcmanfm.conf the first time PCManFM runs
# and never read again for that user, so this file sets what a NEW user starts
# with rather than what everyone is held to.

[config]
bm_open_method=0

[volume]
# Nothing here mounts by itself.  There is no udisks on this system -- libfm is
# built without it -- so these three would have nothing to act through, and
# leaving them on would mean PCManFM trying at every start to do something that
# cannot happen.  Volumes that ARE mounted still appear in the side pane
# through GIO.
mount_on_startup=0
mount_removable=0
autorun=0

[desktop]
# The desktop, for `pcmanfm --desktop'.
#
# The wallpaper is res/LikeOS.png, staged to /usr/share/wallpapers by
# ports/xorg/gtk3/stage.sh.  It is 1920x1200 (16:10), which is exactly the
# preferred resolution the build asks the firmware for -- so on a display that
# grants it the image is drawn at its native size and nothing is resampled.
#
# `fit' is for the displays that do not.  It scales the image by the smaller of
# the two axis ratios, so the whole picture stays visible and keeps its shape;
# a lower-resolution screen gets it shrunk, never cut.  `crop' would fill the
# screen edge to edge but throw away whatever overhangs, and there is nothing
# here to crop -- the file is already the largest size this system asks for.
# `stretch' fills it too, by squashing the picture to the screen's aspect
# ratio.
#
# Where the aspect ratios differ, `fit' leaves a band on the short axis, and
# desktop_bg below is what fills it.
#
# Spelled as a NAME rather than a number.  The parser
# (fm_app_config_load_desktop_config) reads a leading digit as a mode number
# only for '0'..'4'; 5 and 6 fall through to the name lookup, fail it, and
# silently become 0 -- a plain colour and no wallpaper at all.  Names work for
# every mode, so this file uses them and the trap does not apply.
wallpaper_mode=fit
wallpaper=/usr/share/wallpapers/LikeOS.png

# desktop_bg is not decoration under `fit': it is the band along the short axis
# on any display whose aspect ratio is not 16:10, whatever shows through an
# image with alpha, and what the desktop repaints as if the file goes missing.
#
# #6f9c9c is exactly the colour xinitrc sets with xsetroot, so the moment
# between the server starting and the desktop drawing its wallpaper is a
# steady colour rather than a flash of something else.
desktop_bg=#6f9c9c
desktop_fg=#ffffff
desktop_shadow=#000000

# Do NOT hand right-clicks to the window manager: PCManFM's own desktop menu is
# what the right button opens.
#
# With this on, PCManFM ignores the click and replays it onto the root window
# with XSendEvent so ctwm can answer.  The replayed press and release arrive
# together, and ctwm's release handler acts on whatever entry the freshly
# posted menu placed under the pointer -- so a plain right-click on the desktop
# could select "Restart ctwm" and strip the session of its decorations.
#
# ctwm's root menu is not lost: it is on the LEFT button over the background
# (see res/xorg/system.ctwmrc), which PCManFM leaves alone.
show_wm_menu=0

# Keep the icons clear of the panel along the top of the screen.
#
# xinitrc parks xclock at +0+0 and xload at +64+0, and system.ctwmrc puts the
# icon manager at +168+0 and the workspace manager at -0+0 -- a 52-pixel strip
# across the whole width.  None of them is a panel in the EWMH sense: they set
# no _NET_WM_STRUT, so ctwm cannot narrow _NET_WORKAREA and PCManFM has no way
# to know the strip is spoken for.  The first row of icons landed underneath it.
#
# 56 is the strip plus a little air.  Applied to the WORK AREA by the port patch
# 0002-let-the-config-reserve-screen-edges-for-panels, so it costs the top edge
# only -- the desktop margins are symmetric and would have wasted the bottom to
# match.
reserve_top=56

# Show the standard places on the desktop, as every desktop-capable file
# manager does: the user's home, the trash and any mounted volume.
show_documents=1
show_trash=1
show_mounts=1

[ui]
win_width=800
win_height=600
splitter_pos=180
side_pane_mode=1
view_mode=0
show_hidden=0
sort_type=0
sort_by=2
max_tab_chars=32
