# PCManFM's system-wide defaults, installed as
# /etc/xdg/pcmanfm/default/pcmanfm.conf.
#
# Copied to ~/.config/pcmanfm/default/pcmanfm.conf the first time PCManFM runs
# and never read again for that user, so this file sets what a NEW user starts
# with rather than what everyone is held to.

[config]
bm_open_method=0

[volume]
# Nothing here mounts by itself.  There is no udisks on this system -- libfm is
# built without it -- so these three would have nothing to act through, and
# leaving them on would mean PCManFM trying at every start to do something that
# cannot happen.  Volumes that ARE mounted still appear in the side pane
# through GIO.
mount_on_startup=0
mount_removable=0
autorun=0

[desktop]
# The desktop, for `pcmanfm --desktop'.
#
# The wallpaper is res/LikeOS.png, staged to /usr/share/wallpapers by
# ports/xorg/gtk3/stage.sh.  It is 1920x1200 (16:10), which is exactly the
# preferred resolution the build asks the firmware for -- so on a display that
# grants it the image is drawn at its native size and nothing is resampled.
#
# `stretch' is for the displays that do not: it scales each axis independently
# so the image covers the screen edge to edge, at the cost of the picture's
# proportions where the aspect ratio differs from 16:10.  Chosen deliberately
# over the alternatives -- `fit' keeps the shape but leaves a band of
# desktop_bg along the short axis, and `crop' covers the screen keeping the
# shape but throws away the overhang, and there is nothing here to spare: the
# file is already the largest size this system asks for.
#
# Spelled as a NAME rather than a number.  The parser
# (fm_app_config_load_desktop_config) reads a leading digit as a mode number
# only for '0'..'4'; 5 and 6 fall through to the name lookup, fail it, and
# silently become 0 -- a plain colour and no wallpaper at all.  Names work for
# every mode, so this file uses them and the trap does not apply.
wallpaper_mode=stretch
wallpaper=/usr/share/wallpapers/LikeOS.png

# desktop_bg no longer shows as a band -- `stretch' covers every pixel -- but
# it is still what shows through an image with alpha, and what the desktop
# repaints as if the file goes missing.
#
# Black, which is exactly what xinitrc sets with xsetroot -- see the note
# there.  The two have to agree: anything else makes the moment between the
# server starting and the desktop drawing its wallpaper a flash of a third
# colour, and black is the one the screen is already showing.
desktop_bg=#000000
desktop_fg=#ffffff
desktop_shadow=#000000

# Do NOT hand right-clicks to the window manager: PCManFM's own desktop menu is
# what the right button opens.
#
# With this on, PCManFM ignores the click and replays it onto the root window
# with XSendEvent so ctwm can answer.  The replayed press and release arrive
# together, and ctwm's release handler acts on whatever entry the freshly
# posted menu placed under the pointer -- so a plain right-click on the desktop
# could select "Restart ctwm" and strip the session of its decorations.
#
# ctwm's root menu is not lost: it is on the LEFT button over the background
# (see res/xorg/system.ctwmrc), which PCManFM leaves alone.
show_wm_menu=0

# Keep the icons clear of the panel along the BOTTOM of the screen.
#
# xinitrc starts taskbar(1), which spans the full width at the bottom -- a
# 34-pixel strip: the Windows 2000 taskbar's 28 plus the ctwm-style frame
# around it.  It DOES set
# _NET_WM_STRUT_PARTIAL, so ctwm can narrow _NET_WORKAREA for it and a client
# that consults the work area keeps clear on its own.  This stays as well
# because PCManFM reads the work area only when its desktop window is created:
# the panel and the desktop start together and whichever loses the race would
# place a row of icons underneath the bar.
#
# The top reserve is zero on purpose.  Icons fill from the top-left, so with
# nothing above them the first row starts where the screen does -- which is
# what a desktop with a bottom panel should look like, and what the old value
# was still stealing after the bar moved down.
#
# Applied to the WORK AREA by the port patch
# 0002-let-the-config-reserve-screen-edges-for-panels, which reserves each edge
# separately; the desktop's own margins are symmetric and would otherwise have
# cost the top to pay for the bottom.
reserve_top=0
reserve_bottom=38

# Show the standard places on the desktop, as every desktop-capable file
# manager does: the user's home, the trash and any mounted volume.
show_documents=1
show_trash=1
show_mounts=1

[ui]
win_width=800
win_height=600
splitter_pos=180
side_pane_mode=1
view_mode=0
show_hidden=0
sort_type=0
sort_by=2
max_tab_chars=32
