# GTK 3 settings for LikeOS.
#
# GTK normally takes these from a settings daemon over D-Bus, or from XSETTINGS
# published by a desktop environment.  There is neither here -- the session is
# ctwm started by xinit -- so this file is where they come from.  Without it GTK
# falls back to its built-in defaults, which assume a desktop that can answer.
#
# Copyright (C) 2026 The LikeOS Project

[Settings]

# The font every widget uses unless told otherwise: Selawik (SIL Open Font
# Licence), the LikeOS interface font, at 9 points (12 pixels at 96 dpi) --
# the size the desktop's layouts are drawn for.  Named explicitly, which also
# saves a round trip through fontconfig's generic-family matching at every
# program's start-up.
gtk-font-name = Selawik 9

# The LikeOS theme: /usr/share/themes/LikeOS/gtk-3.0/gtk.css, compiled from
# res/xorg/gtk3/theme/src (Adwaita's widget structure with the LikeOS
# palette, sizes and controls).  Without that file GTK falls back to
# Adwaita.
gtk-theme-name = LikeOS
gtk-icon-theme-name = LikeOS

# The cursor theme, generated by host/gen-cursors.c into
# /usr/share/icons/LikeOS.  It defines only the BUSY cursors -- an animated
# ring -- and every other shape falls through to the X core cursor font,
# which is why it costs well under a megabyte.  Without this GTK asks for the
# core font's "watch", a 1-bit wristwatch.
gtk-cursor-theme-name = LikeOS
gtk-cursor-theme-size = 32

# Grey antialiasing rather than subpixel: subpixel rendering depends on knowing
# the physical order of the red, green and blue elements of the panel, and a
# framebuffer console or a virtual machine cannot say what that is.  Guessing
# produces colour fringing on text, which looks worse than no subpixel at all.
gtk-xft-antialias = 1
gtk-xft-rgba = none

# Slight hinting: enough to keep stems on the pixel grid at small sizes,
# without the distortion full hinting applies to letter shapes.
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight

# Pointer and caret timings: a double click within half a second (GTK's
# default is 0.4 s, which is short for many people), a drag that starts after
# four pixels of movement (GTK waits for eight, which makes small drags feel
# sticky), and a caret that is on for 530 ms and off for 530 ms.
gtk-double-click-time = 500
gtk-dnd-drag-threshold = 4
gtk-cursor-blink-time = 1060

# A click in a scroll bar's track pages towards the click instead of jumping
# the thumb to it; Shift-click jumps.
gtk-primary-button-warps-slider = 0

# A list sorted in ascending order shows a chevron pointing up over its
# sorted column, and descending one pointing down -- the arrow points the way
# the values grow.  GTK's default is the other way round.
gtk-alternative-sort-arrows = 1

# Dialogs keep their buttons along the bottom, under the content, rather
# than moving them into a header bar (ctwm draws the title bars).
gtk-dialogs-use-header = 0

# Middle-click pastes the primary selection, as X programs expect.
gtk-enable-primary-paste = 1
# Recently used files are kept for 30 days in ~/.local/share/recently-used.xbel
# -- the list LikeOS Explorer's Home shows, filtered to what still exists and the
# user may open.  0 here emptied the list on every save, so Home never had any.
# A user who does not want the list turns it off in Explorer settings
# (or clears it there), which every program shares.
gtk-recent-files-max-age = 30

# ctwm draws the window borders and title bars, so GTK must not draw its own.
# With this set, a GTK window that would otherwise be client-side decorated
# gets an ordinary window the window manager can manage.
gtk-decoration-layout = :
