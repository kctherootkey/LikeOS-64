# libfm's system-wide defaults, installed as /etc/xdg/libfm/libfm.conf.
#
# This is upstream's own file with the two answers that depend on THIS system
# filled in.  A user's ~/.config/libfm/libfm.conf overrides it key by key, so
# nothing here is a decision the user cannot reverse from the Preferences
# dialog.

[config]
# Which terminal "Open Terminal" and "Run in terminal" actually run.
#
# Left unset, libfm asks: it walks /usr/share/libfm/terminals.list looking for
# a program that exists, and if the answer is not obvious it opens a dialog in
# the middle of doing what was asked.  xterm is the terminal on this image and
# the first entry in that list, so name it and be done -- the list still
# supplies the argument syntax (-e to run a command, -hold -e to keep the
# window open afterwards).
terminal=xterm

# No archiver.  The entry exists so that its absence is a decision rather than
# an oversight: "Extract Here" and "Compress" are drawn from this, and there is
# no xarchiver, file-roller or squeeze on this image for them to drive.  Set it
# to one of the names in /usr/share/libfm/archivers.list if one is installed
# later, and the menu items appear.
archiver=

# Two clicks to open, which is what the rest of this desktop does.
single_click=0

# Deleting moves to ~/.local/share/Trash and asks first.  Both are upstream's
# defaults and both are kept deliberately: this file manager runs as root as
# often as not on a single-user machine.
use_trash=1
confirm_del=1
confirm_trash=1

# Thumbnails for local files only, and only for files up to 2MB.  Generating
# one means reading and scaling the whole image, and a directory of large
# photographs on a machine with this one's I/O rate is a directory that takes a
# long time to appear.
thumbnail_local=1
thumbnail_max=2048

# Sizes in KB rather than KiB (1000, not 1024), matching what df and ls -h on
# this system report.
si_unit=1

[ui]
big_icon_size=48
small_icon_size=24
pane_icon_size=24
thumbnail_size=128
show_thumbnail=1
