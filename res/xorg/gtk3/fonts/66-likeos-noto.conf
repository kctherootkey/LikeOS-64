<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Which Noto face answers for which language.

  LikeOS carries one Noto family for every script of the keyboard layouts it
  offers (see the comments in ports/xorg/gtk3/packages.list).  Most of them
  need no rule at all: nothing else on the image draws Thai, Devanagari or
  Ethiopic, so fontconfig's own ordering (fonts that cover the requested
  language first) already finds the only face that can.  This file is for
  the cases where that ordering picks the wrong one of several, and there are
  three kinds.

    * Scripts DejaVu Sans also draws: Arabic, Hebrew, Armenian, Georgian, Lao,
      Tifinagh and the Canadian syllabics.  DejaVu is the system's generic
      sans-serif (local.conf), so without a rule it wins for those languages
      too, with glyphs drawn as an extension of a Latin design.  Text TAGGED
      with one of those languages gets the Noto face of its script instead.
      Untagged text keeps DejaVu, exactly as on any system that makes DejaVu
      its default face.

    * Arabic itself, which three Noto families draw.  Arabic, Persian, Pashto,
      Sorani Kurdish, Uyghur, Sindhi and Iranian Azerbaijani get Noto Sans
      Arabic for sans-serif and Noto Naskh Arabic for serif; Urdu and
      Shahmukhi Punjabi get Noto Nastaliq Urdu, the hand their readers
      expect.  Without this, the serif search for Arabic found Nastaliq, the
      most decorative of the three.

    * Chinese, Japanese and Korean.  The CJK collections hold one design in
      five regional forms (the same Unicode ideograph is drawn differently in
      China, Taiwan, Hong Kong, Japan and Korea), and all five cover exactly
      the same characters, so nothing in fontconfig's ordering can tell them
      apart.  The language decides where it is known; where it is not,
      Simplified Chinese comes first, then Traditional, Hong Kong, Japanese and
      Korean.  The monospaced cuts follow the same order for monospace.

  "Tagged" means the request carries the language.  GTK programs always do:
  Pango tags every run of text with a language for its script (Thai text is
  "th", kana is "ja") or with the program's locale.  The browser engine does
  it for the characters a page's own face cannot draw: it looks those up
  with the language of the element they are in (its lang attribute), which
  is where these rules pick the region for CJK and the Noto face for the
  other scripts.  Characters the page's face CAN draw stay in it, so Arabic
  in a page set in plain sans-serif is drawn by DejaVu Sans, as it would be
  on any system with DejaVu as the default.  A page that names a CJK face
  gets the region of that name from 35-likeos-cjk-aliases.conf.

  The language tests are substring tests ("contains"), because a language
  arrives with or without its territory ("ja", or "ja-jp" from a Japanese
  locale) and both must match.  The few language codes that contain another
  one (Kabyle, Kara-Kalpak and Kamba contain Georgian's "ka", Konkani
  contains Korean's "ko", Fanti contains Persian's "fa") are excluded by name
  where it matters.

  prepend_first rather than prepend: the face has to come before DejaVu Sans,
  which local.conf and 60-latin.conf have already put ahead of the generic
  name itself.  It is added with weak binding (the default for an edit), so a
  family a program or a page named outright still beats it.

  Copyright (C) 2026 The LikeOS Project
-->
<fontconfig>

  <!-- ===== Scripts DejaVu also covers ===================================== -->

  <!-- Arabic script, every language that writes it except Urdu (below). -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <test name="lang" compare="not_contains"><string>fat</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <test name="lang" compare="not_contains"><string>fat</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ps</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ps</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ku-iq</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ku-iq</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ku-ir</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ku-ir</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>az-ir</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>az-ir</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ug</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ug</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>sd</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>sd</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Naskh Arabic</string></edit>
  </match>

  <!-- And for every other request that ends up among the Arabic faces (an
       Arabic-script language with no rule above, a monospace request, text
       with no language at all): Noto Sans Arabic, or Naskh for serif, ahead
       of Nastaliq.  Nastaliq is in no generic list, so it only ever answers
       for Urdu. -->
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept><family>Noto Naskh Arabic</family><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>

  <!-- Urdu and Shahmukhi Punjabi: Nastaliq for both generic families, with
       Noto Sans Arabic behind it for the few characters Nastaliq lacks. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ur</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Noto Nastaliq Urdu</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ur</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Noto Nastaliq Urdu</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>pa-pk</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Noto Nastaliq Urdu</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>pa-pk</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Noto Nastaliq Urdu</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Hebrew and Yiddish.  There is no serif Hebrew here; the sans answers
       both, as it did before this file for serif. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Hebrew</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>yi</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Hebrew</string></edit>
  </match>

  <!-- Armenian, Georgian, Lao, Tifinagh (Berber of Morocco, fontconfig's
       "ber-ma") and Inuktitut. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>hy</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Armenian</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ka</string></test>
    <test name="lang" compare="not_contains"><string>kaa</string></test>
    <test name="lang" compare="not_contains"><string>kab</string></test>
    <test name="lang" compare="not_contains"><string>kam</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Georgian</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>lo</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Lao</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ber-ma</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Tifinagh</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>iu</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Canadian Aboriginal</string></edit>
  </match>

  <!-- ===== Chinese, Japanese, Korean ====================================== -->

  <!-- No CJK language known: Simplified Chinese first.  accept puts the
       faces straight after the generic name, behind the Latin faces the
       earlier rules prefer, so they only ever answer for what those do not
       draw. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </accept>
  </alias>
  <!-- No serif CJK face is installed; the sans answers serif requests. -->
  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>

  <!-- The language known: its own regional form first, for each generic
       family.  zh-sg writes Simplified characters, zh-mo Traditional ones in
       the Hong Kong forms. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="lang" compare="not_contains"><string>kok</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="lang" compare="not_contains"><string>kok</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="lang" compare="not_contains"><string>kok</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK KR</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

</fontconfig>
