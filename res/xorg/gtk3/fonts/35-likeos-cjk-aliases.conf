<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  CJK family names pages ask for, answered with the Noto Sans CJK region
  that name stands for.

  A page that names a Japanese, Korean or Traditional Chinese face it expects
  to find on the reader's machine gets the Noto collection's form for that
  region, with the binding of the name it asked for: the same arrangement
  30-metric-aliases.conf makes for Arial and Liberation Sans, and what lets
  the browser engine accept the substitute rather than moving on to the
  page's next choice.  That matters because the engine chooses a page's own
  face by family name alone, without the page's language, so the language
  rules of 66-likeos-noto.conf cannot pick the region for that face; the
  name is the one sign of it.  Simplified Chinese names need no entry: SC is
  what an unnamed or unknown CJK request gets already.

  Numbered before 60-latin.conf and 65-nonlatin.conf on purpose.  Those
  expand the generic families into long lists of preferred faces, some of
  them names below (65-nonlatin.conf puts "Hiragino Sans" in the sans-serif
  list); running after them, these rules would also fire on those expanded
  lists, and every sans-serif request would then prefer the Japanese form.
  Before them, only a name the program or page itself gave is matched.

  The regional open-source names come first; the rest are the faces that
  come with other systems and are named in the font lists of Japanese,
  Korean, Taiwanese and Hong Kong sites.

  Copyright (C) 2026 The LikeOS Project
-->
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans JP</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans JP</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Hiragino Sans</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Hiragino Kaku Gothic ProN</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Hiragino Kaku Gothic Pro</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>YuGothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Meiryo</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>IPAexGothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>IPAPGothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans KR</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans KR</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans K</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Nanum Gothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>NanumGothic</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Dotum</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gulim</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans TC</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans TC</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans TW</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang TC</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Heiti TC</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PMingLiU</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>MingLiU</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans HK</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans HC</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Source Han Sans HK</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang HK</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>

</fontconfig>
