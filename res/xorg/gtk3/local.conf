<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Local fontconfig rules for LikeOS.

  The X.Org port's fonts.conf lists /usr/share/fonts/X11/misc, the bitmap PCF
  fonts the X server needs.  The scalable fonts a toolkit renders through
  FreeType live somewhere else, and fontconfig only finds what it is told
  about, so this adds that directory and nothing more.
-->
<fontconfig>

  <!-- Where the TrueType fonts are.  DejaVu is the only family here; the
       directory is named rather than the family so that dropping another
       font file in beside it is enough to make it available. -->
  <dir>/usr/share/fonts/truetype</dir>

  <!-- What the generic families resolve to.  DejaVu ships its own rules
       (the 57-dejavu-* files in conf.d) which do this properly; these are
       the fallback for the case where a program asks for a family name that
       matches nothing at all, so that it gets a real font rather than
       whatever fontconfig happens to sort first. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <!-- Match the rendering settings in /etc/gtk-3.0/settings.ini, so that a
       program using fontconfig directly and one using GTK's settings agree
       about how text should look.  See that file for why subpixel is off. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

</fontconfig>
