<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Local fontconfig rules for LikeOS.

  The X.Org port's fonts.conf lists /usr/share/fonts/X11/misc, the bitmap PCF
  fonts the X server needs.  The scalable fonts a toolkit renders through
  FreeType live somewhere else, and fontconfig only finds what it is told
  about, so this adds that directory and nothing more.
-->
<fontconfig>

  <!-- Where the TrueType fonts are: DejaVu, Liberation, Noto Sans and
       Selawik.  The directory is named rather than the families, so dropping
       another font file in beside them is enough to make it available.

       Liberation is the load-bearing one for the web.  fontconfig's
       30-metric-aliases.conf maps Arial, Helvetica, Times New Roman and
       Courier New onto Liberation Sans/Serif/Mono, which are metrically
       identical to them, so a page whose CSS names those (most of the web
       that does not ship its own webfont) is laid out with the widths its
       designer used.  With DejaVu alone every such page was set in a wider
       face, which overflowed navigation bars and pushed elements over the
       links they were meant to sit beside. -->
  <dir>/usr/share/fonts/truetype</dir>

  <!-- What the generic families resolve to.  DejaVu ships its own rules
       (the 57-dejavu-* files in conf.d) which do this properly; these are
       the fallback for the case where a program asks for a family name that
       matches nothing at all, so that it gets a real font rather than
       whatever fontconfig happens to sort first.

       Left on DejaVu deliberately, which is what Debian and Ubuntu resolve a
       bare `sans-serif' to as well: a page that names no family at all should
       look the same here as it does there.  Pages that DO name one are
       handled by the metric aliases above, which is the case that was
       broken. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <!-- Segoe UI is answered with Selawik, the desktop's own interface font:
       Microsoft published Selawik under the OFL as the open substitute for
       Segoe UI, drawn to the same metrics.  The desktop names Selawik
       directly; this is for everything that names the Windows face instead
       (pages whose CSS asks for "Segoe UI" first, above all), so that they
       get a face of the width they were laid out for rather than DejaVu. -->
  <match target="pattern">
    <test qual="any" name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family" compare="eq"><string>Segoe UI Variable</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family" compare="eq"><string>Segoe UI Variable Text</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family" compare="eq"><string>Segoe UI Variable Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Selawik</string></edit>
  </match>

  <!-- Match the rendering settings in /etc/gtk-3.0/settings.ini, so that a
       program using fontconfig directly and one using GTK's settings agree
       about how text should look.  See that file for why subpixel is off. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

</fontconfig>
