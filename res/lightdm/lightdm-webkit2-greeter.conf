# /etc/lightdm/lightdm-webkit2-greeter.conf - the login screen's settings.
#
# Copyright (C) 2026 The LikeOS Project
#
# [greeter]
# debug_mode          = right-click menu with the web inspector (theme work only)
# detect_theme_errors = offer a fallback theme when the page logs an error.
#                       Off: the fallback themes it offers are not installed,
#                       and any console line containing "error" -- a harmless
#                       resource-load warning included -- would put that
#                       dialog over the login screen.
# screensaver_timeout = blank the screen after this many idle seconds
# secure_mode         = the theme may load nothing from the network
# time_format         = moment.js format of the time the theme may show
# time_language       = "auto": the system's language
# webkit_theme        = the theme, a directory under
#                       /usr/share/lightdm-webkit2-greeter/themes
#
# [branding]
# background_images   = a directory of backgrounds a theme may offer
# logo                = a logo a theme may show
# user_image          = the picture of a user without ~/.face
# (the LikeOS theme brings its own background and pictures)

[greeter]
debug_mode          = false
detect_theme_errors = false
screensaver_timeout = 300
secure_mode         = true
time_format         = LT
time_language       = auto
webkit_theme        = likeos

[branding]
background_images   = /usr/share/lightdm-webkit2-greeter/themes/likeos/img
logo                =
user_image          =
