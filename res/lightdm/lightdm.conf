# /etc/lightdm/lightdm.conf - the graphical login (LightDM).
#
# Copyright (C) 2026 The LikeOS Project
#
# LightDM is started by likeos-dm (init's inittab), which also takes care of
# the system message bus being up first and of switching to the console and
# back.  Every key LightDM knows is documented, with its default, in
# lightdm(1) and in the example file upstream ships; only what LikeOS sets
# differently is here.

[LightDM]
# Running state (the X servers' authorization files) under /run, beside the
# message bus's socket.
run-directory=/run/lightdm

[Seat:*]
# The X server: the configuration matching the machine's display driver,
# chosen as startx's xserverrc chooses it (/usr/libexec/likeos-xserver).
# LightDM adds the display, -seat, -auth and -nolisten tcp; there are no
# virtual terminals, so no vtN.
xserver-command=/usr/libexec/likeos-xserver

# Run as root once the X server is up and before the greeter starts: the
# keyboard layout set in Settings > Keyboard (/etc/likeos/keyboard.conf), so
# a password is typed with the layout it was chosen with.  It never fails
# (LightDM would stop the display): see the script.
display-setup-script=/usr/libexec/likeos-display-setup

# The login screen: LightDM's WebKit greeter with LikeOS's theme
# (/etc/lightdm/lightdm-webkit2-greeter.conf), started through a wrapper that
# gives it the environment a desktop session gets (GPU or software GL, the
# cursor theme, a runtime directory).
greeter-session=lightdm-webkit2-greeter
greeter-wrapper=/usr/libexec/likeos-greeter-session

# The desktop a user signs in to: /usr/share/xsessions/likeos.desktop, run
# through /etc/lightdm/Xsession (the login environment of /etc/profile).
user-session=likeos
session-wrapper=/etc/lightdm/Xsession

# One display server on the one screen: no second session beside a running
# one (there are no virtual terminals to switch between) and no guest.
allow-user-switching=false
allow-guest=false
