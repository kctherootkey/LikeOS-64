# /etc/audiod.conf - configuration of the LikeOS audio service, audiod(1).
#
# Copyright (C) 2026 The LikeOS Project
#
# Format: one "key = value" per line; '#' or ';' starts a comment.  The file
# is parsed strictly: an unknown key, a key given twice or a value out of
# range rejects the whole file (audiod logs the line), and the service keeps
# its built-in defaults (at start) or the previous configuration (on
# SIGHUP).  Check a change with "audiod -t" and apply it with
# "kill -HUP <pid of audiod>".  This file must stay owned by root and not
# be writable by group or others, or audiod ignores it.
#
# Every setting below shows its default.

# ---- the sound card -------------------------------------------------------

# auto: the first card that can play (the one used last is preferred);
# or a card number 0-7; or /dev/audioN.
device = auto

# Sample rate the card runs at: auto (48000 Hz when the card can, else
# 44100 Hz) or 8000..192000.  Streams at other rates are resampled.
rate = auto

# Sample format on the card: auto (16 bit when available), s16, s24,
# s24_3, s20, s32, float or u8.
format = auto

# Channels on the card: auto (2) or 1..8.  Streams are up- or down-mixed.
channels = auto

# Period length in milliseconds (1..100) and number of periods in the card's
# ring (2..32).  The card adds period_ms * periods of latency: 100 ms here.
# Larger values survive a busy system better; smaller ones answer faster.
# Keep periods longer than about 16 ms: an emulated card in a virtual
# machine may only be serviced once per host timer tick (15.6 ms on many
# hosts) and advance at most one period each time, so shorter periods make
# it play slow and catch up in bursts.
period_ms = 25
periods = 4

# Use the card's own amplifier for the master volume when it has one
# (auto), always (yes, if present) or never (no: scale the samples).
hw_volume = auto

# Stop the card after this many milliseconds of silence (0 = never).  A
# stopped card costs no wakeups; it restarts as soon as something plays.
suspend_ms = 5000

# ---- sound quality ----------------------------------------------------------

# Resampler: best (64-tap windowed sinc, ~100 dB), good (32 taps, ~80 dB)
# or fast (linear interpolation).
resample_quality = good

# Master volume (0..100) when there is no saved state in
# /var/lib/audiod/state.
default_volume = 75

# Buffer of a stream that does not ask for one, in milliseconds (10..2000).
default_buffer_ms = 40

# ---- event sounds ---------------------------------------------------------

# Play system sounds (start-up, log-in, notifications) from
# /usr/share/sounds/likeos: yes or no.
event_sounds = yes

# Event sounds one user may start within 10 seconds (1..1000).
event_rate = 10

# ---- limits -----------------------------------------------------------------

# Connections at once (1..256); one user may hold at most 3/4 of them.
max_clients = 64

# Streams one user may have open (1..64).
max_streams_per_user = 16

# Stream buffer memory per user, in KiB (64..262144).
max_buffer_kb_per_user = 16384

# ---- logging ----------------------------------------------------------------

# error, warning, info or debug.  audiod -v / -vv raise it from the
# command line.
log_level = warning
