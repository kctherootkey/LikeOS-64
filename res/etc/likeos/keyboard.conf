# /etc/likeos/keyboard.conf - the keyboard layout of this machine
#
# Written by Settings > Keyboard and by loadkeys (through
# /usr/libexec/likeos-keyboard-save), read by the X session
# (likeos-xkb-apply) and by init, which loads the console keymap at boot.
# The values are XKB names, comma lists of equal length:
#
#   LAYOUT   the layouts, e.g. de or de,us; the first is the console's
#   VARIANT  their variants, an empty entry for a layout's default
#   OPTIONS  XKB options, e.g. grp:alt_shift_toggle
#
# The layouts and variants available are those of
# /usr/share/likeos/keyboard/layouts.tsv.
LAYOUT=us
VARIANT=
OPTIONS=
